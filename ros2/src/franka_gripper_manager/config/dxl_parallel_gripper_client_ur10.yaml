# picking cell (UR10e)
dxl_parallel_gripper_client_ur10:
  ros__parameters:
    # Serial port settings
    port: "/dev/ttyUSB0"  # TODO: picking cell U2D2의 /dev/serial/by-id/... 경로로 변경
    baud: 57600

    # Dynamixel motor settings
    dxl_id: 2
    dxl_min_position: 1710   # DXL step (gripper fully closed)
    dxl_max_position: 2731   # DXL step (gripper fully open)
    dxl_max_current: 600     # mA (Current-Based Position mode limit)

    # ROS topic names
    gripper_command_topic: "/picking_cell/ur10e/gripper/target_gripper_width_percent"
    joint_states_topic: "/picking_cell/ur10e/gripper/joint_states"

    # Control mode settings
    control_mode: "continuous"    # "continuous" or "binary"
    binary_threshold: 0.9       # only used when control_mode is "binary"
    position_snap_threshold: 0.02  # 2% of the gripper width
