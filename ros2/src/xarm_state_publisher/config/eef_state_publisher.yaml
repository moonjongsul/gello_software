eef_state_publisher:
  ros__parameters:
    # ------------------------------------------------------------------
    # Inputs
    #
    # joint_states_topic: subscribe to the DRIVER's topic, not the
    #   aggregated /joint_states. joint_state_publisher relays that one at
    #   its own `rate` parameter (10 Hz by default), which would throttle
    #   this node to 10 Hz for no reason -- the driver publishes at ~100 Hz.
    # ------------------------------------------------------------------
    joint_states_topic: /xarm/joint_states
    robot_states_topic: /xarm/robot_states

    # ------------------------------------------------------------------
    # Outputs -- both are published on every input sample, sharing the
    # incoming header.stamp so they align with each other and with every
    # other recorded stream.
    # ------------------------------------------------------------------
    pose_topic: /xarm/eef_pose
    twist_topic: /xarm/eef_twist

    # ------------------------------------------------------------------
    # Kinematic chain
    #
    # The xArm URDF ends at the flange (link_eef). The TCP is an offset
    # from it that lives only in the controller, so it is applied on top
    # of the chain rather than being part of it.
    # ------------------------------------------------------------------
    base_link: link_base
    flange_link: link_eef
    frame_id: link_base

    # ------------------------------------------------------------------
    # TCP offset
    #
    # use_reported_offset: take the offset the controller publishes in
    #   RobotMsg.offset. Preferred, because a value written here can drift
    #   out of sync with what the arm is actually using -- and then the
    #   recorded observation quietly stops matching the commanded action.
    #
    # tcp_offset: fallback, used until the first robot_states arrives (it
    #   is only 5 Hz on report_type "normal") and whenever
    #   use_reported_offset is false. Must match the teleop node's
    #   tcp.offset.
    # ------------------------------------------------------------------
    use_reported_offset: true
    tcp_offset: [0.0, 0.0, 185.0, 0.0, 0.0, 0.0]
    tcp_offset_units: mm
